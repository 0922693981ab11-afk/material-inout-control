<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工程材料管制系統 - 卓越旗艦版</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot, deleteDoc, runTransaction, writeBatch, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- 1. Firebase 配置 ---
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = window.__app_id || 'material-hub-ultimate-v24';

        // --- 2. 範本數據 ---
        const MASTER_SAMPLES = [
            { name: "預拌混凝土 4000psi", model: "HFC-4000", unit: "m3", category: "結構工程", spec: "符合 CNS 3036" },
            { name: "竹節鋼筋 #4 (D13)", model: "SD420W", unit: "ton", category: "結構工程", spec: "熱軋鋼筋" },
            { name: "PVC 電線管 1\"", model: "E-PIPE", unit: "支", category: "水電工程", spec: "南亞牌" },
            { name: "自動撒水頭 68度", model: "SP-68", unit: "個", category: "消防工程", spec: "感熱型" },
            { name: "ABC乾粉滅火器10型", model: "ABC-10型", unit: "具", category: "消防設備", spec: "附標示牌" }
        ];

        // --- 3. 全域狀態管理中心 ---
        window.App = {
            state: {
                user: null,
                activeTab: 'project_select',
                currentProject: null,
                projects: [],
                materials: [],
                masterMaterials: [],
                logs: [],
                globalUserCount: 0,
                searchTerm: '',
                selectedImportIds: [],
                editingId: null,
                editFormData: {},
                isAddingNew: false
            },

            n: (v) => Number(v || 0),

            init: async function() {
                try {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                    
                    onAuthStateChanged(auth, (user) => {
                        if (user) {
                            this.state.user = user;
                            document.getElementById('user-id').innerText = user.uid.slice(-6);
                            document.getElementById('user-initial').innerText = user.uid.charAt(0).toUpperCase();
                            this.initGlobalSync();
                            this.renderSidebar();
                            this.render();
                        }
                    });
                } catch (e) {
                    this.showToast("系統初始化失敗", "error");
                }
            },

            // --- 雲端數據同步 ---
            initGlobalSync: function() {
                onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'projects'), s => {
                    this.state.projects = s.docs.map(d => ({ id: d.id, ...d.data() }));
                    this.render();
                });
                onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'master_materials'), s => {
                    this.state.masterMaterials = s.docs.map(d => ({ id: d.id, ...d.data() }));
                    this.render();
                });
                const statsRef = doc(db, 'artifacts', appId, 'public', 'data', 'stats', 'global');
                onSnapshot(statsRef, d => {
                    if (d.exists()) {
                        this.state.globalUserCount = d.data().userCount || 0;
                        document.getElementById('global-count').innerText = this.state.globalUserCount;
                    }
                });
                runTransaction(db, async (t) => {
                    const d = await t.get(statsRef);
                    if (!d.exists()) t.set(statsRef, { userCount: 1 });
                    else t.update(statsRef, { userCount: (d.data().userCount || 0) + 1 });
                }).catch(()=>{});
            },

            syncProjectData: function(projId) {
                onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'materials'), s => {
                    this.state.materials = s.docs.map(d => ({ id: d.id, ...d.data() })).filter(m => m.projectId === projId);
                    this.render();
                });
                onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'logs'), s => {
                    this.state.logs = s.docs.map(d => ({ id: d.id, ...d.data() })).filter(l => l.projectId === projId).sort((a,b) => new Date(b.date) - new Date(a.date));
                    this.render();
                });
            },

            // --- 控制器 ---
            switchTab: function(tab) {
                this.state.activeTab = tab;
                this.state.editingId = null;
                this.state.isAddingNew = false;
                this.state.searchTerm = '';
                this.renderSidebar();
                this.render();
            },

            enterProject: function(id) {
                const proj = this.state.projects.find(p => p.id === id);
                if (proj) {
                    this.state.currentProject = proj;
                    this.syncProjectData(id);
                    this.switchTab('dashboard');
                }
            },

            setSearchTerm: function(val) {
                this.state.searchTerm = val.toLowerCase();
                this.renderListOnly();
            },

            // --- 專案操作 ---
            openCreateModal: () => document.getElementById('modal-create-project').classList.remove('hidden'),
            closeCreateModal: () => document.getElementById('modal-create-project').classList.add('hidden'),

            createProject: async function() {
                const name = document.getElementById('new-proj-name').value;
                const conNo = document.getElementById('new-proj-no').value;
                if (!name || !conNo) return this.showToast("請填寫完整資訊", "error");
                const id = `proj_${Date.now()}`;
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'projects', id), {
                    id, name, contractNo: conNo, owner: this.state.user.uid, createdAt: new Date().toISOString()
                });
                this.closeCreateModal();
                this.showToast("新工程已發起");
            },

            createSampleProject: async function() {
                if(!confirm('載入「高雄三井Lalaport新建工程」範本？')) return;
                const id = `proj_sample_${Date.now()}`;
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'projects', id), {
                    id, name: "範例：高雄三井Lalaport新建工程", contractNo: "CON-YT-2026", owner: this.state.user.uid, createdAt: new Date().toISOString()
                });
                const batch = writeBatch(db);
                MASTER_SAMPLES.forEach(m => {
                    const matId = `mat_${Math.random().toString(36).substr(2, 9)}`;
                    batch.set(doc(db, 'artifacts', appId, 'public', 'data', 'materials', matId), { ...m, projectId: id, contractQty: 1000, safetyStock: 50 });
                });
                await batch.commit();
                this.enterProject(id);
                this.showToast("範本數據載入成功");
            },

            saveAsProject: async function() {
                const newName = prompt("請輸入新專案名稱：", `${this.state.currentProject.name} (副本)`);
                const newNo = prompt("請輸入新合約編號：", `${this.state.currentProject.contractNo}-COPY`);
                if (!newName || !newNo) return;
                const newId = `proj_${Date.now()}`;
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'projects', newId), {
                    id: newId, name: newName, contractNo: newNo, owner: this.state.user.uid, createdAt: new Date().toISOString()
                });
                const batch = writeBatch(db);
                this.state.materials.forEach(m => {
                    const matId = `mat_${Math.random().toString(36).substr(2, 9)}`;
                    const { id, projectId, ...data } = m;
                    batch.set(doc(db, 'artifacts', appId, 'public', 'data', 'materials', matId), { ...data, projectId: newId });
                });
                await batch.commit();
                this.showToast("專案架構複製完成");
                this.switchTab('project_select');
            },

            deleteDoc: async function(col, id, msg) {
                if (confirm(msg)) {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', col, id));
                    this.showToast("數據已刪除");
                    if (col === 'projects' && this.state.currentProject?.id === id) location.reload();
                }
            },

            // --- 材料編輯 ---
            startEdit: function(type, id, data) {
                this.state.editingId = id;
                this.state.isAddingNew = id === 'new';
                this.state.editFormData = data || { category: '一般', contractQty: 0, safetyStock: 0 };
                this.render();
            },

            cancelEdit: function() {
                this.state.editingId = null;
                this.state.isAddingNew = false;
                this.state.editFormData = {};
                this.render();
            },

            updateEditForm: function(field, value) {
                this.state.editFormData[field] = value;
            },

            saveMaterial: async function(isMaster) {
                const d = this.state.editFormData;
                if (!d.name) return this.showToast("品名為必填", "error");
                const col = isMaster ? 'master_materials' : 'materials';
                const prefix = isMaster ? 'master_' : 'mat_';
                const finalId = (this.state.editingId && this.state.editingId !== 'new') ? this.state.editingId : `${prefix}${Date.now()}`;
                const payload = { ...d };
                if (isMaster) payload.updatedBy = this.state.user.uid;
                else {
                    payload.projectId = this.state.currentProject.id;
                    payload.contractQty = this.n(d.contractQty);
                    payload.safetyStock = this.n(d.safetyStock);
                }
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', col, finalId), payload, { merge: true });
                this.cancelEdit();
                this.showToast("儲存成功");
            },

            // --- 批次導入 ---
            openBatchImport: function() {
                this.state.selectedImportIds = [];
                document.getElementById('modal-import').classList.remove('hidden');
                this.renderImportList();
            },

            toggleImportItem: function(id) {
                const idx = this.state.selectedImportIds.indexOf(id);
                if (idx === -1) this.state.selectedImportIds.push(id);
                else this.state.selectedImportIds.splice(idx, 1);
                this.renderImportList();
            },

            executeBatchImport: async function() {
                if (this.state.selectedImportIds.length === 0) return;
                const batch = writeBatch(db);
                this.state.selectedImportIds.forEach(id => {
                    const item = this.state.masterMaterials.find(m => m.id === id);
                    if (item) {
                        const matId = `mat_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`;
                        batch.set(doc(db, 'artifacts', appId, 'public', 'data', 'materials', matId), {
                            projectId: this.state.currentProject.id, 
                            name: item.name, spec: item.spec || "", model: item.model || "", unit: item.unit || "具", category: item.category || "一般",
                            contractQty: 0, safetyStock: 0
                        });
                    }
                });
                await batch.commit();
                document.getElementById('modal-import').classList.add('hidden');
                this.showToast(`成功導入 ${this.state.selectedImportIds.length} 項材料`);
            },

            // --- 領料表單邏輯 ---
            handleFormInput: function() {
                const matId = document.getElementById('f-mat').value;
                const qty = this.n(document.getElementById('f-qty').value);
                const type = document.getElementById('f-type').value;
                const mat = this.state.materials.find(m => String(m.id) === String(matId));
                
                const stockDisplay = document.getElementById('f-stock-display');
                if (mat) {
                    const proc = this.getProcessedMaterials().find(x => x.id === mat.id);
                    stockDisplay.classList.remove('hidden');
                    document.getElementById('f-current-stock').innerText = `${proc.stock} ${proc.unit}`;
                    
                    if (type === '出貨') {
                        const totalOut = proc.totalOut;
                        const isOver = (totalOut + qty) > this.n(mat.contractQty);
                        const w = document.getElementById('overload-warning');
                        if (isOver) w.classList.remove('hidden');
                        else w.classList.add('hidden');
                    } else {
                        document.getElementById('overload-warning').classList.add('hidden');
                    }
                } else {
                    stockDisplay.classList.add('hidden');
                }
            },

            submitLog: async function(e) {
                e.preventDefault();
                const matId = document.getElementById('f-mat').value;
                const qty = this.n(document.getElementById('f-qty').value);
                const type = document.getElementById('f-type').value;
                const note = document.getElementById('f-note').value;
                const reason = document.getElementById('f-reason')?.value || "";

                if (!matId || qty <= 0) return this.showToast("請選擇材料與填寫正確數量", "error");

                if (type === '出貨') {
                    const proc = this.getProcessedMaterials().find(x => x.id === matId);
                    if (qty > proc.stock) return this.showToast("領料失敗：在庫量不足", "error");
                }

                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'logs'), {
                    projectId: this.state.currentProject.id, materialId: matId, qty, type,
                    date: document.getElementById('f-date').value,
                    note: note + (reason ? ` [超領原因: ${reason}]` : ""),
                    user: this.state.user.uid,
                    createdAt: new Date().toISOString()
                });
                this.showToast("異動紀錄同步成功");
                this.switchTab('logs');
            },

            exportCSV: function() {
                if (!this.state.currentProject) return;
                const h = ["日期", "單別", "屬性", "品名", "規格", "型號", "數量", "單位", "操作人員", "備註"];
                const r = this.state.logs.map(l => {
                    const m = this.state.materials.find(mat => String(mat.id) === String(l.materialId));
                    return [l.date, l.type, m?.category || "", m?.name || "已刪除", m?.spec || "", m?.model || "", l.qty, m?.unit || "", l.user.slice(-6), l.note];
                });
                const content = "\uFEFF" + [h, ...r].map(e => e.join(",")).join("\n");
                const blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = `工程材料單_${this.state.currentProject.contractNo}.csv`;
                link.click();
            },

            // --- 計算屬性 ---
            getProcessedMaterials: function() {
                return this.state.materials.map(m => {
                    const mLogs = this.state.logs.filter(l => String(l.materialId) === String(m.id));
                    const totalIn = mLogs.filter(l => l.type === '進貨').reduce((s, l) => s + this.n(l.qty), 0);
                    const totalOut = mLogs.filter(l => l.type === '出貨').reduce((s, l) => s + this.n(l.qty), 0);
                    const stock = totalIn - totalOut;
                    const progress = Math.min(100, Math.round((totalOut / (this.n(m.contractQty) || 1)) * 100));
                    return { ...m, totalIn, totalOut, stock, progress, 
                             isOver: totalOut > this.n(m.contractQty),
                             isLow: stock <= this.n(m.safetyStock) && stock > 0,
                             isEmpty: stock <= 0 };
                });
            },

            // --- 渲染部分 ---
            renderSidebar: function() {
                document.querySelectorAll('.nav-btn').forEach(b => {
                    b.classList.remove('bg-blue-600', 'text-white', 'shadow-xl');
                    b.classList.add('text-slate-400', 'hover:bg-slate-800');
                });
                const activeBtn = document.getElementById(`nav-${this.state.activeTab}`);
                if (activeBtn) {
                    activeBtn.classList.add('bg-blue-600', 'text-white', 'shadow-xl');
                    activeBtn.classList.remove('text-slate-400', 'hover:bg-slate-800');
                }
                const pInfo = document.getElementById('sidebar-project-info');
                if (this.state.currentProject) {
                    pInfo.classList.remove('hidden');
                    document.getElementById('sidebar-project-name').innerText = this.state.currentProject.name;
                } else pInfo.classList.add('hidden');
            },

            render: function() {
                const main = document.getElementById('main-area');
                if (!main) return;
                const tab = this.state.activeTab;
                
                let headerHtml = '';
                if (tab === 'project_select') {
                    headerHtml = `<div class="flex justify-between items-start mb-10 gap-8">
                                    <div><h2 class="text-6xl font-black text-slate-900 tracking-tighter italic">開案中心</h2>
                                    <span class="px-3 py-1 bg-white border rounded-full text-[10px] font-black uppercase text-slate-500 shadow-sm flex items-center gap-2 mt-4 italic"><i data-lucide="globe" size="12"></i> 雲端同步系統 (吳啓仲開發)</span></div>
                                    <div class="flex gap-4">
                                        <button onclick="App.createSampleProject()" class="bg-amber-500 text-white px-8 py-4 rounded-3xl font-black shadow-xl hover:bg-amber-600 transition flex items-center gap-2 text-sm italic"><i data-lucide="sparkles"></i> 載入範本專案</button>
                                        <button onclick="App.openCreateModal()" class="bg-blue-600 text-white px-10 py-4 rounded-3xl font-black shadow-2xl hover:bg-blue-700 transition flex items-center gap-3 italic uppercase text-sm font-mono tracking-widest"><i data-lucide="folder-plus"></i> NEW_PROJECT</button>
                                    </div>
                                  </div>
                                  <div class="mb-10 relative">
                                    <i data-lucide="search" class="absolute left-6 top-1/2 -translate-y-1/2 text-slate-300" size="24"></i>
                                    <input type="text" oninput="App.setSearchTerm(this.value)" value="${this.state.searchTerm}" placeholder="快速搜尋專案..." class="w-full pl-16 pr-8 py-6 bg-white border-2 border-slate-50 rounded-[2.5rem] text-xl font-bold shadow-sm focus:border-blue-500 outline-none">
                                  </div>`;
                } else if (tab === 'master_library') {
                    headerHtml = `<div class="flex justify-between items-center mb-10">
                                    <div><h2 class="text-4xl font-black text-slate-900 tracking-tighter italic uppercase font-mono tracking-tight">Master_Library</h2>
                                    <p class="text-slate-400 font-bold uppercase text-[10px] tracking-widest font-mono">Global Materials Hub</p></div>
                                    ${!this.state.isAddingNew ? `<div class="flex gap-4">
                                        <button onclick="App.seedMasterLibrary()" class="bg-white border-2 border-slate-200 text-slate-600 px-6 py-3 rounded-2xl font-black hover:bg-slate-50 transition shadow-sm text-sm italic tracking-widest uppercase">Seed_Data</button>
                                        <button onclick="App.startEdit('master', 'new')" class="bg-slate-900 text-white px-8 py-3 rounded-2xl font-black shadow-xl hover:bg-slate-800 transition active:scale-95 flex items-center gap-2 italic uppercase text-sm"><i data-lucide="plus"></i> Add_Standard</button>
                                    </div>` : ''}
                                  </div>`;
                } else if (tab === 'dashboard') {
                    headerHtml = `<div class="flex justify-between items-end border-b border-slate-100 pb-8 mb-8">
                                    <div><h2 class="text-4xl font-black text-slate-900 tracking-tighter mb-2 italic underline decoration-blue-500 decoration-8 underline-offset-8">${this.state.currentProject.name}</h2>
                                    <p class="text-slate-400 font-bold uppercase tracking-widest text-[10px] font-mono italic">CONTRACT_NO: ${this.state.currentProject.contractNo}</p></div>
                                    <button onclick="App.saveAsProject()" class="bg-white border-2 border-slate-200 text-slate-600 px-5 py-2.5 rounded-2xl text-xs font-black hover:bg-slate-50 transition shadow-sm flex items-center gap-2 italic"><i data-lucide="copy" size="14"></i> 複製專案副本</button>
                                  </div>`;
                } else if (tab === 'inventory') {
                    headerHtml = `<div class="flex justify-between items-center mb-10">
                                    <div><h2 class="text-4xl font-black text-slate-900 tracking-tighter italic">合約細項與庫存</h2>
                                    <p class="text-slate-400 font-bold uppercase text-[10px] tracking-widest font-mono">Contract Items Monitor</p></div>
                                    <div class="flex gap-4">
                                        <button onclick="App.openBatchImport()" class="bg-white border-2 border-slate-200 text-blue-600 px-6 py-3 rounded-2xl font-black hover:bg-blue-50 transition shadow-sm flex items-center gap-2 text-sm italic tracking-widest uppercase"><i data-lucide="database" size="18"></i> Import_Master</button>
                                        <button onclick="App.startEdit('material', 'new')" class="bg-slate-900 text-white px-8 py-3 rounded-2xl font-black shadow-xl hover:bg-slate-800 transition text-sm flex items-center gap-2 italic uppercase tracking-widest font-mono"><i data-lucide="plus" size="18"></i> Manual_Entry</button>
                                    </div>
                                  </div>`;
                } else if (tab === 'logs') {
                    headerHtml = `<div class="flex justify-between items-center bg-white p-10 rounded-[3rem] border border-slate-100 shadow-sm mb-10">
                                    <div><h2 class="text-3xl font-black text-slate-900 tracking-tighter italic uppercase font-mono tracking-tight underline decoration-blue-500 decoration-4">History_Logs</h2>
                                    <p class="text-slate-400 font-bold uppercase tracking-widest text-[10px] font-mono mt-1 italic">Real-time Transaction Feed</p></div>
                                    <button onclick="App.exportCSV()" class="bg-slate-900 text-white px-8 py-4 rounded-2xl hover:bg-slate-800 transition shadow-xl active:scale-95 flex items-center gap-3 font-black text-sm italic font-mono uppercase tracking-widest"><i data-lucide="download" size="18"></i> Export_CSV</button>
                                  </div>`;
                }

                main.innerHTML = `<div class="p-8 md:p-16 max-w-7xl mx-auto animate-in fade-in">${headerHtml}<div id="list-container"></div></div>`;
                this.renderListOnly();
                lucide.createIcons();
            },

            renderListOnly: function() {
                const container = document.getElementById('list-container');
                if (!container) return;
                const tab = this.state.activeTab;
                const term = this.state.searchTerm;
                let html = '';

                if (tab === 'project_select') {
                    const filtered = this.state.projects.filter(p => p.name.toLowerCase().includes(term) || p.contractNo.toLowerCase().includes(term));
                    html = `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                                ${filtered.map(p => `
                                    <div onclick="App.enterProject('${p.id}')" class="group bg-white p-10 rounded-[4.5rem] border-2 border-transparent hover:border-blue-500 cursor-pointer transition-all shadow-sm hover:shadow-2xl flex flex-col h-[320px]">
                                        <div class="flex justify-between items-start mb-8">
                                            <div class="w-16 h-16 bg-slate-50 rounded-2xl flex items-center justify-center group-hover:bg-blue-50 transition"><i data-lucide="briefcase" class="text-slate-300 group-hover:text-blue-600" size="32"></i></div>
                                            <span class="text-[10px] font-black bg-slate-100 text-slate-500 px-3 py-1.5 rounded-xl uppercase tracking-widest font-mono italic">${p.contractNo}</span>
                                        </div>
                                        <h3 class="text-2xl font-black text-slate-800 mb-3 leading-tight group-hover:text-blue-600 transition line-clamp-2 italic">${p.name}</h3>
                                        <div class="mt-auto pt-8 border-t border-slate-50 flex justify-between items-center text-slate-400 text-[10px] font-black uppercase tracking-widest font-mono italic">
                                            <p>EST. ${p.createdAt?.split('T')[0]}</p>
                                            <button onclick="event.stopPropagation(); App.deleteDoc('projects', '${p.id}', '確定永久刪除工程資料？')" class="text-slate-200 hover:text-red-500 transition p-2 bg-white rounded-full"><i data-lucide="trash-2" size="18"></i></button>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>`;
                } else if (tab === 'master_library') {
                    const filtered = this.state.masterMaterials.filter(m => m.name.toLowerCase().includes(term) || (m.model||'').toLowerCase().includes(term));

                        <i data-lucide="package" size="14"></i> Contract_Scope
                    </button>
                    <button id="nav-form" onclick="App.switchTab('form')" class="nav-btn w-full flex items-center gap-4 px-6 py-3.5 rounded-xl hover:bg-slate-800 text-slate-400 text-xs font-black transition-all italic">
                        <i data-lucide="plus-circle" size="14"></i> Sync_Records
                    </button>
                    <button id="nav-logs" onclick="App.switchTab('logs')" class="nav-btn w-full flex items-center gap-4 px-6 py-3.5 rounded-xl hover:bg-slate-800 text-slate-400 text-xs font-black transition-all italic">
                        <i data-lucide="history" size="14"></i> Transaction_Logs
                    </button>
                </div>
            </div>
        </div>

        <div class="mt-auto pt-8 border-t border-slate-800 space-y-4">
            <div class="flex items-center gap-4">
                <div id="user-initial" class="w-12 h-12 rounded-[1.2rem] bg-blue-600/20 flex items-center justify-center border border-blue-500/30 text-blue-400 font-black shadow-inner font-mono text-xl">?</div>
                <div>
                    <p class="text-[10px] text-slate-500 font-black uppercase tracking-tighter italic">Designer: WU CHI CHUNG</p>
                    <p class="text-sm font-black text-slate-200 italic font-mono tracking-tighter">在線：<span id="global-count">0</span> 人</p>
                    <p class="text-[9px] text-slate-600 font-mono tracking-tighter mt-1 uppercase">UID: <span id="user-id">------</span></p>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main id="main-area" class="flex-1 overflow-y-auto custom-scrollbar relative bg-[#f8fafc]">
        <div class="h-full flex items-center justify-center animate-pulse">
            <div class="flex flex-col items-center gap-4 italic font-black uppercase tracking-widest text-xs text-slate-400">
                <i data-lucide="refresh-cw" class="animate-spin text-blue-500" size="32"></i>
                Connecting with Cloud_Hub...
            </div>
        </div>
    </main>

    <!-- Modals -->
    <div id="modal-create-project" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex items-center justify-center p-6 hidden">
        <div class="bg-white w-full max-w-2xl p-16 rounded-[4.5rem] shadow-2xl border-t-8 border-blue-600 animate-in zoom-in italic">
            <h2 class="text-5xl font-black text-slate-900 mb-2 tracking-tighter italic uppercase text-center tracking-widest">Establish_Project</h2>
            <p class="text-slate-400 text-[10px] font-black uppercase tracking-widest mb-12 italic underline decoration-blue-500 decoration-4 text-center font-mono">Authorized_Developer: WU CHI CHUNG</p>
            <div class="space-y-8">
                <div class="space-y-2"><label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1 font-mono italic">Project_Full_Name</label>
                    <input id="new-proj-name" type="text" placeholder="工程中文全銜" class="w-full p-7 bg-slate-50 border-2 border-transparent rounded-[2rem] font-black text-xl outline-none focus:bg-white focus:border-blue-500 transition-all shadow-inner italic uppercase"></div>
                <div class="space-y-2"><label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1 font-mono italic">Contract_Serial_No</label>
                    <input id="new-proj-no" type="text" placeholder="如 CON-2026-YT01" class="w-full p-7 bg-slate-50 border-2 border-transparent rounded-[2rem] font-mono font-black text-xl outline-none focus:bg-white focus:border-blue-500 transition-all shadow-inner tracking-widest italic text-blue-600"></div>
                <div class="flex gap-4 pt-4">
                    <button onclick="App.closeCreateModal()" class="flex-1 py-7 font-black text-slate-400 hover:text-slate-800 transition tracking-widest uppercase font-mono">Cancel</button>
                    <button onclick="App.createProject()" class="flex-1 bg-blue-600 text-white py-7 rounded-[2.5rem] font-black shadow-2xl hover:bg-blue-700 active:scale-95 transition-all text-xl uppercase tracking-tighter font-mono italic">Establish_Now</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Batch Import Modal -->
    <div id="modal-import" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex items-center justify-center p-6 hidden">
        <div class="bg-white w-full max-w-3xl p-12 rounded-[4rem] shadow-2xl flex flex-col max-h-[85vh] animate-in zoom-in border-t-8 border-blue-600 italic">
            <div class="flex justify-between items-center mb-8">
                <div><h3 class="text-4xl font-black tracking-tighter italic font-mono uppercase">Batch_Import_Hub</h3>
                <p class="text-slate-400 font-bold text-[10px] mt-2 uppercase tracking-widest font-mono italic">Select Items from Global Master_Library</p></div>
                <button onclick="document.getElementById('modal-import').classList.add('hidden')" class="p-2 hover:bg-slate-100 rounded-full transition"><i data-lucide="x"></i></button>
            </div>
            <div id="import-list-container" class="overflow-y-auto pr-2 custom-scrollbar flex-1"></div>
            <div class="mt-8 flex gap-4 pt-6 border-t border-slate-50"><button onclick="App.executeBatchImport()" class="flex-1 bg-blue-600 text-white py-7 rounded-[3rem] font-black text-xl shadow-2xl hover:bg-blue-700 transition active:scale-95 italic tracking-widest uppercase font-mono">Confirm_Batch_Import</button></div>
        </div>
    </div>

</body>
</html>
