<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工程材料管制系統 - 企業旗艦版</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot, deleteDoc, runTransaction, writeBatch, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- 1. Firebase 配置 ---
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = window.__app_id || 'material-hub-enterprise-v1';

        // --- 2. 標準物料主檔 (Master Data) ---
        const MASTER_SAMPLES = [
            { name: "預拌混凝土 4000psi", model: "HFC-4000", spec: "符合 CNS 3036 規範", unit: "m3", category: "結構工程" },
            { name: "竹節鋼筋 #4 (D13)", model: "SD420W", spec: "熱軋竹節鋼筋", unit: "ton", category: "結構工程" },
            { name: "PVC 電線管 1\"", model: "E-PIPE", spec: "南亞牌 厚管", unit: "支", category: "水電工程" },
            { name: "自動撒水頭 68度", model: "SP-68", spec: "感熱型撒水頭", unit: "個", category: "消防工程" },
            { name: "ABC乾粉滅火器 10型", model: "ABC-10", spec: "附原廠掛勾與標示牌", unit: "具", category: "消防設備" }
        ];

        // --- 3. 全域狀態與 ERP 邏輯 ---
        window.App = {
            state: {
                user: null,
                activeTab: 'project_select',
                currentProject: null,
                projects: [],
                materials: [],
                masterMaterials: [],
                logs: [],
                globalUserCount: 0,
                searchTerm: '',
                selectedImportIds: [],
                editingId: null,
                editFormData: {},
                isAddingNew: false
            },

            n: (v) => Number(v || 0),

            generateVoucherNo: function(type) {
                const prefix = type === '出貨' ? 'REQ' : 'RCV'; // Requisition vs Receiving
                const datePart = new Date().toISOString().split('T')[0].replace(/-/g, '');
                const randomPart = Math.floor(1000 + Math.random() * 9000);
                return `${prefix}-${datePart}-${randomPart}`;
            },

            init: async function() {
                try {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                    
                    onAuthStateChanged(auth, (user) => {
                        if (user) {
                            this.state.user = user;
                            document.getElementById('user-id').innerText = user.uid.slice(-6);
                            document.getElementById('user-initial').innerText = user.uid.charAt(0).toUpperCase();
                            this.initGlobalSync();
                            this.renderSidebar();
                            this.render();
                        }
                    });
                } catch (e) {
                    this.showToast("資料庫連線失敗，請聯繫系統管理員", "error");
                }
            },

            initGlobalSync: function() {
                onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'projects'), s => {
                    this.state.projects = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
                    this.render();
                });
                onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'master_materials'), s => {
                    this.state.masterMaterials = s.docs.map(d => ({ id: d.id, ...d.data() }));
                    this.render();
                });

                const statsRef = doc(db, 'artifacts', appId, 'public', 'data', 'stats', 'global');
                onSnapshot(statsRef, d => {
                    if (d.exists()) {
                        this.state.globalUserCount = d.data().userCount || 0;
                        const countEl = document.getElementById('global-count');
                        if(countEl) countEl.innerText = this.state.globalUserCount;
                    }
                });

                runTransaction(db, async (t) => {
                    const d = await t.get(statsRef);
                    if (!d.exists()) t.set(statsRef, { userCount: 1 });
                    else t.update(statsRef, { userCount: (d.data().userCount || 0) + 1 });
                }).catch(()=>{});
            },

            syncProjectData: function(projId) {
                onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'materials'), s => {
                    this.state.materials = s.docs.map(d => ({ id: d.id, ...d.data() })).filter(m => m.projectId === projId);
                    this.render();
                });
                onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'logs'), s => {
                    this.state.logs = s.docs.map(d => ({ id: d.id, ...d.data() })).filter(l => l.projectId === projId).sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
                    this.render();
                });
            },

            switchTab: function(tab) {
                this.state.activeTab = tab;
                this.state.editingId = null;
                this.state.isAddingNew = false;
                this.state.searchTerm = '';
                this.renderSidebar();
                this.render();
            },

            enterProject: function(id) {
                const proj = this.state.projects.find(p => p.id === id);
                if (proj) {
                    this.state.currentProject = proj;
                    this.syncProjectData(id);
                    this.switchTab('dashboard');
                }
            },

            setSearchTerm: function(val) {
                this.state.searchTerm = val.toLowerCase();
                this.renderListOnly();
            },

            openCreateModal: () => document.getElementById('modal-create-project').classList.remove('hidden'),
            closeCreateModal: () => document.getElementById('modal-create-project').classList.add('hidden'),

            createProject: async function() {
                const name = document.getElementById('new-proj-name').value;
                const conNo = document.getElementById('new-proj-no').value;
                if (!name || !conNo) return this.showToast("專案名稱與代號為必填", "error");
                const id = `proj_${Date.now()}`;
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'projects', id), {
                    id, name, contractNo: conNo, owner: this.state.user.uid, createdAt: new Date().toISOString()
                });
                this.closeCreateModal();
                this.showToast("新專案已建檔");
            },

            createSampleProject: async function() {
                if(!confirm('系統將載入標準示範專案，是否繼續？')) return;
                const id = `proj_sample_${Date.now()}`;
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'projects', id), {
                    id, name: "示範專案：高雄三井 Lalaport 新建工程", contractNo: "PRJ-2026-YT01", owner: this.state.user.uid, createdAt: new Date().toISOString()
                });
                const batch = writeBatch(db);
                MASTER_SAMPLES.forEach(m => {
                    const matId = `mat_${Math.random().toString(36).substr(2, 9)}`;
                    batch.set(doc(db, 'artifacts', appId, 'public', 'data', 'materials', matId), { ...m, projectId: id, contractQty: 1000, safetyStock: 50 });
                });
                await batch.commit();
                this.enterProject(id);
                this.showToast("範本專案已備妥");
            },

            saveAsProject: async function() {
                const newName = prompt("輸入複製專案名稱：", `${this.state.currentProject.name} (複製)`);
                const newNo = prompt("輸入新專案代號：", `${this.state.currentProject.contractNo}-COPY`);
                if (!newName || !newNo) return;
                const newId = `proj_${Date.now()}`;
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'projects', newId), {
                    id: newId, name: newName, contractNo: newNo, owner: this.state.user.uid, createdAt: new Date().toISOString()
                });
                const batch = writeBatch(db);
                this.state.materials.forEach(m => {
                    const matId = `mat_${Math.random().toString(36).substr(2, 9)}`;
                    const { id, projectId, ...data } = m;
                    batch.set(doc(db, 'artifacts', appId, 'public', 'data', 'materials', matId), { ...data, projectId: newId });
                });
                await batch.commit();
                this.showToast("BOM 表架構已複製");
                this.switchTab('project_select');
            },

            deleteDoc: async function(col, id, msg) {
                if (confirm(msg)) {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', col, id));
                    this.showToast("資料已移除");
                }
            },

            startEdit: function(type, id, data) {
                this.state.editingId = id;
                this.state.isAddingNew = id === 'new';
                this.state.editFormData = data || { category: '一般耗材', contractQty: 0, safetyStock: 0, unit: 'EA' };
                this.render();
            },

            cancelEdit: function() {
                this.state.editingId = null;
                this.state.isAddingNew = false;
                this.state.editFormData = {};
                this.render();
            },

            updateEditForm: function(field, value) {
                this.state.editFormData[field] = value;
            },

            saveMaterial: async function(isMaster) {
                const d = this.state.editFormData;
                if (!d.name) return this.showToast("物料名稱必填", "error");
                const col = isMaster ? 'master_materials' : 'materials';
                const prefix = isMaster ? 'sku_' : 'bom_';
                const finalId = (this.state.editingId && this.state.editingId !== 'new') ? this.state.editingId : `${prefix}${Date.now()}`;
                const payload = { ...d };
                if (isMaster) payload.updatedBy = this.state.user.uid;
                else {
                    payload.projectId = this.state.currentProject.id;
                    payload.contractQty = this.n(d.contractQty);
                    payload.safetyStock = this.n(d.safetyStock);
                }
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', col, finalId), payload, { merge: true });
                this.cancelEdit();
                this.showToast("存檔成功");
            },

            openBatchImport: function() {
                this.state.selectedImportIds = [];
                document.getElementById('modal-import').classList.remove('hidden');
                this.renderImportList();
            },

            toggleImportItem: function(id) {
                const idx = this.state.selectedImportIds.indexOf(id);
                if (idx === -1) this.state.selectedImportIds.push(id);
                else this.state.selectedImportIds.splice(idx, 1);
                this.renderImportList();
            },

            executeBatchImport: async function() {
                if (this.state.selectedImportIds.length === 0) return;
                const batch = writeBatch(db);
                this.state.selectedImportIds.forEach(id => {
                    const item = this.state.masterMaterials.find(m => m.id === id);
                    if (item) {
                        const matId = `bom_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`;
                        batch.set(doc(db, 'artifacts', appId, 'public', 'data', 'materials', matId), {
                            projectId: this.state.currentProject.id, 
                            name: item.name, spec: item.spec || "", model: item.model || "", unit: item.unit || "EA", category: item.category || "未分類",
                            contractQty: 0, safetyStock: 0
                        });
                    }
                });
                await batch.commit();
                document.getElementById('modal-import').classList.add('hidden');
                this.showToast(`成功匯入 ${this.state.selectedImportIds.length} 筆 SKU`);
            },

            // --- 異動單據處理 ---
            handleFormInput: function() {
                const matId = document.getElementById('f-mat').value;
                const qty = this.n(document.getElementById('f-qty').value);
                const type = document.getElementById('f-type').value;
                const mat = this.state.materials.find(m => String(m.id) === String(matId));
                
                const stockDisplay = document.getElementById('f-stock-display');
                if (mat) {
                    const proc = this.getProcessedMaterials().find(x => x.id === mat.id);
                    stockDisplay.classList.remove('hidden');
                    document.getElementById('f-current-stock').innerText = `${proc.stock} ${proc.unit}`;
                    
                    if (type === '出貨') {
                        const isOver = (proc.totalOut + qty) > this.n(mat.contractQty);
                        const w = document.getElementById('overload-warning');
                        if (isOver) {
                            w.classList.remove('hidden');
                            document.getElementById('f-reason').required = true;
                        } else {
                            w.classList.add('hidden');
                            document.getElementById('f-reason').required = false;
                        }
                    } else {
                        document.getElementById('overload-warning').classList.add('hidden');
                        document.getElementById('f-reason').required = false;
                    }
                } else {
                    stockDisplay.classList.add('hidden');
                }
            },

            submitLog: async function(e) {
                e.preventDefault();
                const matId = document.getElementById('f-mat').value;
                const qty = this.n(document.getElementById('f-qty').value);
                const type = document.getElementById('f-type').value;
                const note = document.getElementById('f-note').value;
                const reason = document.getElementById('f-reason')?.value || "";

                if (!matId || qty <= 0) return this.showToast("參數錯誤", "error");

                if (type === '出貨') {
                    const proc = this.getProcessedMaterials().find(x => x.id === matId);
                    if (qty > proc.stock) return this.showToast(`發料阻斷：當前可用庫存僅剩 ${proc.stock} ${proc.unit}`, "error");
                }

                const voucherNo = this.generateVoucherNo(type);
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'logs'), {
                    projectId: this.state.currentProject.id, 
                    materialId: matId, 
                    qty, 
                    type,
                    voucherNo,
                    date: document.getElementById('f-date').value,
                    note: note + (reason ? ` [核准超領: ${reason}]` : ""),
                    user: this.state.user.uid,
                    createdAt: new Date().toISOString()
                });
                
                this.showToast(`單據 ${voucherNo} 處理完畢`);
                this.switchTab('logs');
            },

            exportCSV: function() {
                if (!this.state.currentProject) return;
                const h = ["單據編號", "作業日期", "異動類型", "物料分類", "物料名稱", "型號", "規格", "異動數量", "單位", "作業人員", "稽核備註"];
                const r = this.state.logs.map(l => {
                    const m = this.state.materials.find(mat => String(mat.id) === String(l.materialId));
                    return [l.voucherNo || "無", l.date, l.type, m?.category || "", m?.name || "[物料已刪除]", m?.model || "", m?.spec || "", l.qty, m?.unit || "", l.user.slice(-6), l.note];
                });
                const content = "\uFEFF" + [h, ...r].map(e => e.join(",")).join("\n");
                const blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = `${this.state.currentProject.contractNo}_庫存異動明細_${new Date().toISOString().split('T')[0]}.csv`;
                link.click();
            },

            getProcessedMaterials: function() {
                return this.state.materials.map(m => {
                    const mLogs = this.state.logs.filter(l => String(l.materialId) === String(m.id));
                    const totalIn = mLogs.filter(l => l.type === '進貨').reduce((s, l) => s + this.n(l.qty), 0);
                    const totalOut = mLogs.filter(l => l.type === '出貨').reduce((s, l) => s + this.n(l.qty), 0);
                    const stock = totalIn - totalOut;
                    const progress = Math.min(100, Math.round((totalOut / (this.n(m.contractQty) || 1)) * 100));
                    return { ...m, totalIn, totalOut, stock, progress, 
                             isOver: totalOut > this.n(m.contractQty),
                             isLow: stock <= this.n(m.safetyStock) && stock > 0,
                             isEmpty: stock <= 0 };
                });
            },

            // --- 視圖渲染 ---
            renderSidebar: function() {
                document.querySelectorAll('.nav-btn').forEach(b => {
                    b.classList.remove('bg-indigo-600', 'text-white', 'shadow-md', 'font-bold');
                    b.classList.add('text-slate-400', 'hover:bg-slate-800', 'font-medium');
                });
                const activeBtn = document.getElementById(`nav-${this.state.activeTab}`);
                if (activeBtn) {
                    activeBtn.classList.add('bg-indigo-600', 'text-white', 'shadow-md', 'font-bold');
                    activeBtn.classList.remove('text-slate-400', 'hover:bg-slate-800', 'font-medium');
                }
                const pInfo = document.getElementById('sidebar-project-info');
                if (this.state.currentProject) {
                    pInfo.classList.remove('hidden');
                    document.getElementById('sidebar-project-name').innerText = this.state.currentProject.contractNo;
                    document.getElementById('sidebar-project-desc').innerText = this.state.currentProject.name;
                } else pInfo.classList.add('hidden');
            },

            render: function() {
                const main = document.getElementById('main-area');
                if (!main) return;
                const tab = this.state.activeTab;
                
                let headerHtml = '';
                if (tab === 'project_select') {
                    headerHtml = `
                        <div class="flex justify-between items-end mb-8">
                            <div>
                                <h2 class="text-3xl font-black text-slate-800 tracking-tight">專案樞紐中心 (Project Hub)</h2>
                                <p class="text-sm text-slate-500 mt-2 font-medium">管理所有工程專案與合約配置</p>
                            </div>
                            <div class="flex gap-3">
                                <button onclick="App.createSampleProject()" class="bg-white border border-slate-300 text-slate-600 px-5 py-2.5 rounded-lg text-sm font-semibold shadow-sm hover:bg-slate-50 transition flex items-center gap-2"><i data-lucide="package-open" size="16"></i> 載入示範專案</button>
                                <button onclick="App.openCreateModal()" class="bg-indigo-600 text-white px-5 py-2.5 rounded-lg text-sm font-semibold shadow-sm hover:bg-indigo-700 transition flex items-center gap-2"><i data-lucide="folder-plus" size="16"></i> 立項建檔</button>
                            </div>
                        </div>
                        <div class="mb-8 relative max-w-md">
                            <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400" size="18"></i>
                            <input type="text" oninput="App.setSearchTerm(this.value)" value="${this.state.searchTerm}" placeholder="檢索專案代號或名稱..." class="w-full pl-11 pr-4 py-2.5 bg-white border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all">
                        </div>`;
                } else if (tab === 'master_library') {
                    headerHtml = `
                        <div class="flex justify-between items-end mb-8">
                            <div>
                                <h2 class="text-3xl font-black text-slate-800 tracking-tight">標準物料主檔 (Master Data)</h2>
                                <p class="text-sm text-slate-500 mt-2 font-medium">企業級全域 SKU 基礎數據庫</p>
                            </div>
                            ${!this.state.isAddingNew ? `
                            <div class="flex gap-3">
                                <button onclick="App.seedMasterLibrary()" class="bg-white border border-slate-300 text-slate-600 px-5 py-2.5 rounded-lg text-sm font-semibold shadow-sm hover:bg-slate-50 transition flex items-center gap-2"><i data-lucide="download-cloud" size="16"></i> 載入內建主檔</button>
                                <button onclick="App.startEdit('master', 'new')" class="bg-slate-800 text-white px-5 py-2.5 rounded-lg text-sm font-semibold shadow-sm hover:bg-slate-900 transition flex items-center gap-2"><i data-lucide="plus-circle" size="16"></i> 新增 SKU</button>
                            </div>` : ''}
                        </div>
                        ${!this.state.isAddingNew ? `
                        <div class="mb-6 relative max-w-md">
                            <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400" size="18"></i>
                            <input type="text" oninput="App.setSearchTerm(this.value)" value="${this.state.searchTerm}" placeholder="檢索物料名稱、型號或規格..." class="w-full pl-11 pr-4 py-2 bg-white border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                        </div>` : ''}`;
                } else if (tab === 'dashboard') {
                    headerHtml = `
                        <div class="flex justify-between items-center bg-white p-6 rounded-2xl shadow-sm border border-slate-100 mb-8">
                            <div>
                                <h2 class="text-2xl font-bold text-slate-800">${this.state.currentProject.name}</h2>
                                <div class="flex items-center gap-3 mt-1">
                                    <span class="bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded text-xs font-mono font-bold border border-indigo-100">${this.state.currentProject.contractNo}</span>
                                    <span class="text-xs text-slate-500 font-medium flex items-center gap-1"><i data-lucide="calendar" size="12"></i> 立項日期: ${this.state.currentProject.createdAt.split('T')[0]}</span>
                                </div>
                            </div>
                            <button onclick="App.saveAsProject()" class="text-slate-600 bg-slate-50 border border-slate-200 px-4 py-2 rounded-lg text-sm font-semibold hover:bg-slate-100 transition flex items-center gap-2"><i data-lucide="copy" size="16"></i> 複製專案 BOM</button>
                        </div>`;
                } else if (tab === 'inventory') {
                    headerHtml = `
                        <div class="flex justify-between items-end mb-8">
                            <div>
                                <h2 class="text-3xl font-black text-slate-800 tracking-tight">專案合約 BOM 表 (Contract BOM)</h2>
                                <p class="text-sm text-slate-500 mt-2 font-medium">配置專案所需物料清單與預算額度</p>
                            </div>
                            <div class="flex gap-3">
                                <button onclick="App.openBatchImport()" class="bg-white border border-slate-300 text-indigo-600 px-5 py-2.5 rounded-lg text-sm font-semibold shadow-sm hover:bg-indigo-50 transition flex items-center gap-2"><i data-lucide="import" size="16"></i> 自主檔匯入</button>
                                <button onclick="App.startEdit('material', 'new')" class="bg-slate-800 text-white px-5 py-2.5 rounded-lg text-sm font-semibold shadow-sm hover:bg-slate-900 transition flex items-center gap-2"><i data-lucide="plus" size="16"></i> 專案特規料件</button>
                            </div>
                        </div>
                        ${!this.state.isAddingNew ? `
                        <div class="mb-6 relative max-w-md">
                            <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400" size="18"></i>
                            <input type="text" oninput="App.setSearchTerm(this.value)" value="${this.state.searchTerm}" placeholder="篩選 BOM 內容..." class="w-full pl-11 pr-4 py-2 bg-white border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                        </div>` : ''}`;
                } else if (tab === 'logs') {
                    headerHtml = `
                        <div class="flex justify-between items-end mb-8">
                            <div>
                                <h2 class="text-3xl font-black text-slate-800 tracking-tight">稽核日誌 (Audit Trail)</h2>
                                <p class="text-sm text-slate-500 mt-2 font-medium">所有庫存異動之不可竄改紀錄</p>
                            </div>

                                                <td class="px-6 py-3 text-center"><span class="font-mono text-[10px] bg-slate-100 px-2 py-1 rounded text-slate-500 border border-slate-200">${l.user.slice(-6)}</span></td>
                                            </tr>`;
                                        }).join('')}
                                    </tbody>
                                </table>
                            </div>`;
                }

                container.innerHTML = html;
                lucide.createIcons();
            },

            renderImportList: function() {
                const listHtml = this.state.masterMaterials.map(m => {
                    const isSel = this.state.selectedImportIds.includes(m.id);
                    return `
                        <div onclick="App.toggleImportItem('${m.id}')" class="p-4 bg-white rounded-lg border cursor-pointer mb-2 flex items-center gap-4 transition-colors ${isSel ? 'border-indigo-500 ring-1 ring-indigo-500 bg-indigo-50/30' : 'border-slate-200 hover:border-indigo-300'}">
                            <div class="w-5 h-5 rounded border flex items-center justify-center ${isSel ? 'bg-indigo-600 border-indigo-600 text-white' : 'border-slate-300 bg-white'}">
                                ${isSel ? '<i data-lucide="check" size="12"></i>' : ''}
                            </div>
                            <div class="flex-1">
                                <div class="font-bold text-sm text-slate-800">${m.name}</div>
                                <div class="text-xs text-slate-500 font-mono mt-0.5">${m.model || '無型號'} | ${m.spec || '無規格'}</div>
                            </div>
                            <div class="text-xs font-mono bg-slate-100 px-2 py-1 rounded text-slate-600 border border-slate-200">${m.unit}</div>
                        </div>`;
                }).join('');
                document.getElementById('import-list-container').innerHTML = listHtml || '<p class="text-center py-10 text-slate-400 font-medium text-sm">主檔目前沒有資料</p>';
                lucide.createIcons();
            },

            showToast: function(msg, type = 'success') {
                const toast = document.createElement('div');
                const isErr = type === 'error';
                toast.className = `fixed bottom-6 right-6 flex items-center gap-3 px-6 py-4 rounded-lg shadow-lg z-[500] animate-in slide-in-from-right duration-300 font-semibold text-sm ${isErr ? 'bg-red-600 text-white' : 'bg-slate-900 text-white'}`;
                toast.innerHTML = `<i data-lucide="${isErr ? 'alert-circle' : 'check-circle'}" size="18"></i> <span>${msg}</span>`;
                document.body.appendChild(toast);
                lucide.createIcons();
                setTimeout(() => {
                    toast.classList.add('opacity-0', 'translate-y-2');
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            },

            seedMasterLibrary: async function() {
                if(!confirm('將寫入工程常用之標準 SKU 主檔，確定執行？')) return;
                const batch = writeBatch(db);
                MASTER_SAMPLES.forEach(m => {
                    const mid = `master_${Math.random().toString(36).substr(2, 9)}`;
                    batch.set(doc(db, 'artifacts', appId, 'public', 'data', 'master_materials', mid), { ...m, updatedAt: new Date().toISOString(), updatedBy: this.state.user.uid });
                });
                await batch.commit();
                this.showToast("主檔資料寫入完成");
            }
        };

        window.onload = () => App.init();
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        input[type="number"]::-webkit-inner-spin-button { display: none; }
        .animate-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 h-screen overflow-hidden flex flex-col md:flex-row text-slate-900">

            <div class="flex items-center gap-3 text-white mb-1">
                <i data-lucide="box" size="24" class="text-indigo-500"></i>
                <h1 class="text-xl font-bold tracking-tight">Material Hub</h1>
            </div>
            <p class="text-[10px] font-mono text-slate-500 tracking-widest uppercase">ERP Core v2.5</p>
        </div>

        <div class="flex-1 overflow-y-auto py-4 px-3 space-y-1 custom-scrollbar">
            <div class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2 px-3 mt-2">System 系統總區</div>
            <button id="nav-project_select" onclick="App.switchTab('project_select')" class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-lg transition-colors text-sm font-medium hover:bg-slate-800 hover:text-white">
                <i data-lucide="folders" size="16"></i> 專案樞紐中心
            </button>
            <button id="nav-master_library" onclick="App.switchTab('master_library')" class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-lg transition-colors text-sm font-medium hover:bg-slate-800 hover:text-white">
                <i data-lucide="database" size="16"></i> 標準物料主檔
            </button>

            <div id="sidebar-project-info" class="pt-6 mt-4 border-t border-slate-800 hidden">
                <div class="text-[10px] font-bold text-indigo-400 uppercase tracking-widest mb-2 px-3">Active Project 作業專案</div>
                <div class="px-3 mb-4">
                    <p id="sidebar-project-name" class="font-mono text-xs text-white font-bold"></p>
                    <p id="sidebar-project-desc" class="text-xs text-slate-400 truncate mt-0.5"></p>
                </div>
                <div class="space-y-1">
                    <button id="nav-dashboard" onclick="App.switchTab('dashboard')" class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-lg transition-colors text-sm font-medium hover:bg-slate-800 hover:text-white">
                        <i data-lucide="bar-chart-2" size="16"></i> 營運戰情室

                    <button id="nav-inventory" onclick="App.switchTab('inventory')" class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-lg transition-colors text-sm font-medium hover:bg-slate-800 hover:text-white">
                        <i data-lucide="list-tree" size="16"></i> 合約 BOM 表
                    </button>
                    <button id="nav-form" onclick="App.switchTab('form')" class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-lg transition-colors text-sm font-medium hover:bg-slate-800 hover:text-white">
                        <i data-lucide="scan-line" size="16"></i> 庫存異動作業
                    </button>
                    <button id="nav-logs" onclick="App.switchTab('logs')" class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-lg transition-colors text-sm font-medium hover:bg-slate-800 hover:text-white">
                        <i data-lucide="history" size="16"></i> 稽核日誌
                    </button>
                </div>
            </div>
        </div>

        <div class="p-4 border-t border-slate-800 bg-slate-900/50">
            <div class="flex items-center gap-3">
                <div id="user-initial" class="w-8 h-8 rounded bg-indigo-600 flex items-center justify-center text-white font-bold text-sm shadow-inner">U</div>
                <div class="flex-1 min-w-0">
                    <p class="text-[10px] text-slate-400 font-medium">開發者：吳啓仲</p>
                    <div class="flex justify-between items-center mt-0.5">
                        <p class="text-[10px] font-mono text-slate-500">ID:<span id="user-id">----</span></p>
                        <p class="text-[10px] text-slate-500 flex items-center gap-1"><i data-lucide="users" size="10"></i><span id="global-count">0</span></p>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- 工作區 -->
    <main id="main-area" class="flex-1 overflow-y-auto custom-scrollbar relative">
        <div class="h-full flex items-center justify-center">

    <!-- 模態框：立項 -->
