<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工程材料管制系統 - 旗艦完整版</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot, deleteDoc, runTransaction, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- Firebase 環境配置 ---
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'project-material-ultimate-v100';

        // --- 範本數據 (完整屬性) ---
        const SAMPLE_MATERIALS = [
            { name: "ABC乾粉滅火器10型", spec: "10型 附標示牌", model: "ABC-10型", unit: "具", contractQty: 1124, category: "消防設備", safetyStock: 10 },
            { name: "二氧化碳滅火器10型", spec: "10型 附標示牌", model: "NV-CO2-10", unit: "具", contractQty: 224, category: "消防設備", safetyStock: 5 },
            { name: "室內消防栓箱", spec: "120*70*18_面板 t=2.0", model: "SY-FB-01", unit: "組", contractQty: 38, category: "消防設備", safetyStock: 2 },
            { name: "PVC 管 2\"-E管", spec: "3.6mm", model: "南亞", unit: "M", contractQty: 195, category: "配管工程", safetyStock: 50 },
            { name: "鍍鋅鋼管STPG管", spec: "4\" 鑫陽-光固化管", model: "CNS4626", unit: "M", contractQty: 143, category: "配管工程", safetyStock: 30 }
        ];

        // --- 全域狀態管理中心 (State Management) ---
        window.App = {
            state: {
                user: null,
                activeTab: 'project_select',
                currentProject: null,
                projects: [],
                materials: [],
                masterMaterials: [],
                logs: [],
                globalUserCount: 0,
                searchTerm: '',
                selectedImportIds: [],
                // 編輯狀態
                editingId: null,
                editFormData: {},
                isAddingNew: false,
                // 領料表單狀態
                formType: '出貨',
                formMatId: '',
                formQty: '',
                formNote: '',
                formDate: new Date().toISOString().split('T')[0],
                formReason: ''
            },

            n: (v) => Number(v || 0),

            // --- 核心啟動 ---
            init: async function() {
                try {
                    // RULE 3: 嚴格的身份驗證阻擋
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                    
                    onAuthStateChanged(auth, (user) => {
                        if (user) {
                            this.state.user = user;
                            document.getElementById('user-id').innerText = user.uid.slice(-6);
                            document.getElementById('user-initial').innerText = user.uid.slice(0, 1).toUpperCase();
                            this.initGlobalSync();
                            this.renderSidebar();
                            this.render();
                        }
                    });
                } catch (e) {
                    console.error("Auth Fail:", e);
                    document.getElementById('main-area').innerHTML = `<div class="p-20 text-center font-black text-red-500 text-2xl">系統連線失敗，請檢查權限或重新整理頁面。</div>`;
                }
            },

            // --- 數據同步 (Listeners) ---
            initGlobalSync: function() {
                onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'projects'), s => {
                    this.state.projects = s.docs.map(d => ({ id: d.id, ...d.data() }));
                    this.render();
                });
                onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'master_materials'), s => {
                    this.state.masterMaterials = s.docs.map(d => ({ id: d.id, ...d.data() }));
                    this.render();
                });
                const statsRef = doc(db, 'artifacts', appId, 'public', 'data', 'stats', 'global');
                onSnapshot(statsRef, d => {
                    if (d.exists()) {
                        this.state.globalUserCount = d.data().userCount || 0;
                        document.getElementById('global-count').innerText = this.state.globalUserCount;
                    }
                });
                runTransaction(db, async (t) => {
                    const d = await t.get(statsRef);
                    if (!d.exists()) t.set(statsRef, { userCount: 1 });
                    else t.update(statsRef, { userCount: (d.data().userCount || 0) + 1 });
                }).catch(()=>{});
            },

            syncProjectData: function(projId) {
                onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'materials'), s => {
                    this.state.materials = s.docs.map(d => ({ id: d.id, ...d.data() })).filter(m => m.projectId === projId);
                    this.render();
                });
                onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'logs'), s => {
                    this.state.logs = s.docs.map(d => ({ id: d.id, ...d.data() })).filter(l => l.projectId === projId).sort((a,b) => new Date(b.date) - new Date(a.date));
                    this.render();
                });
            },

            // --- 控制器 (Controllers) ---
            switchTab: function(tab) {
                this.state.activeTab = tab;
                this.state.editingId = null;
                this.state.isAddingNew = false;
                this.state.searchTerm = '';
                this.renderSidebar();
                this.render();
            },

            enterProject: function(id) {
                const proj = this.state.projects.find(p => p.id === id);
                if (proj) {
                    this.state.currentProject = proj;
                    this.syncProjectData(id);
                    this.switchTab('dashboard');
                }
            },

            setSearchTerm: function(val) {
                this.state.searchTerm = val;
                this.renderListOnly();
            },

            // --- 專案操作 ---
            createProject: async function() {
                const name = document.getElementById('new-proj-name').value;
                const conNo = document.getElementById('new-proj-no').value;
                if (!name || !conNo) return alert('請填寫完整資訊');
                const id = `proj_${Date.now()}`;
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'projects', id), {
                    id, name, contractNo: conNo, owner: this.state.user.uid, createdAt: new Date().toISOString()
                });
                document.getElementById('modal-create').classList.add('hidden');
            },

            createSampleProject: async function() {
                if(!confirm('建立三井 Lalaport 範本專案與測試數據？')) return;
                const id = `proj_${Date.now()}`;
                const projData = { id, name: "範例：高雄三井Lalaport新建工程", contractNo: "CON-YT-2026", owner: this.state.user.uid, createdAt: new Date().toISOString() };
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'projects', id), projData);
                
                const batch = writeBatch(db);
                SAMPLE_MATERIALS.forEach(m => {
                    const matId = `mat_${Math.random().toString(36).substr(2, 9)}`;
                    batch.set(doc(db, 'artifacts', appId, 'public', 'data', 'materials', matId), { ...m, projectId: id });
                });
                await batch.commit();
                this.enterProject(id);
            },

            saveAsProject: async function() {
                const newName = prompt("請輸入新專案名稱：", `${this.state.currentProject.name} (副本)`);
                const newNo = prompt("請輸入新合約編號：", `${this.state.currentProject.contractNo}-COPY`);
                if (!newName || !newNo) return;

                const newId = `proj_${Date.now()}`;
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'projects', newId), {
                    id: newId, name: newName, contractNo: newNo, owner: this.state.user.uid, createdAt: new Date().toISOString()
                });

                const batch = writeBatch(db);
                this.state.materials.forEach(m => {
                    const matId = `mat_${Math.random().toString(36).substr(2, 9)}`;
                    const { id, projectId, ...data } = m;
                    batch.set(doc(db, 'artifacts', appId, 'public', 'data', 'materials', matId), { ...data, projectId: newId, contractQty: m.contractQty || 0 });
                });
                await batch.commit();
                alert("專案架構複製成功！");
                this.switchTab('project_select');
            },

            deleteDoc: async function(col, id, confirmMsg) {
                if (confirm(confirmMsg)) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', col, id));
            },

            // --- 庫存與合約編輯 ---
            startEdit: function(type, id, data) {
                this.state.editingId = id;
                this.state.isAddingNew = id === 'new';
                this.state.editFormData = data || { category: '一般' };
                this.render();
            },

            cancelEdit: function() {
                this.state.editingId = null;
                this.state.isAddingNew = false;
                this.state.editFormData = {};
                this.render();
            },

            updateEditForm: function(field, value) {
                this.state.editFormData[field] = value;
                // 為了不讓 focus 跑掉，只更新內部狀態。綁定的 input 會用 oninput 觸發
            },

            saveMaterial: async function(isMaster) {
                const d = this.state.editFormData;
                if (!d.name) return alert('品名為必填');
                
                const col = isMaster ? 'master_materials' : 'materials';
                const prefix = isMaster ? 'master_' : 'mat_';
                const finalId = (this.state.editingId && this.state.editingId !== 'new') ? this.state.editingId : `${prefix}${Date.now()}`;
                
                const payload = { ...d };
                if (isMaster) payload.updatedBy = this.state.user.uid;
                else {
                    payload.projectId = this.state.currentProject.id;
                    payload.contractQty = this.n(d.contractQty);
                    payload.safetyStock = this.n(d.safetyStock);
                }

                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', col, finalId), payload, { merge: true });
                this.cancelEdit();
            },

            // --- 批次導入 ---
            openBatchImport: function() {
                this.state.selectedImportIds = [];
                document.getElementById('modal-import').classList.remove('hidden');
                this.renderImportList();
            },

            toggleImportItem: function(id, el) {
                const idx = this.state.selectedImportIds.indexOf(id);
                const box = el.querySelector('.select-box');
                if (idx === -1) {
                    this.state.selectedImportIds.push(id);
                    box.classList.remove('bg-white', 'border-slate-300');
                    box.classList.add('bg-blue-600', 'border-blue-600');
                    box.innerHTML = '<i data-lucide="check" class="text-white" size="14"></i>';
                } else {
                    this.state.selectedImportIds.splice(idx, 1);
                    box.classList.add('bg-white', 'border-slate-300');
                    box.classList.remove('bg-blue-600', 'border-blue-600');
                    box.innerHTML = '';
                }
                lucide.createIcons();
            },

            executeBatchImport: async function() {
                if (this.state.selectedImportIds.length === 0) return;
                const batch = writeBatch(db);
                this.state.selectedImportIds.forEach(id => {
                    const item = this.state.masterMaterials.find(m => m.id === id);
                    if (item) {
                        const matId = `mat_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`;
                        batch.set(doc(db, 'artifacts', appId, 'public', 'data', 'materials', matId), {
                            projectId: this.state.currentProject.id, 
                            name: item.name, spec: item.spec || "", model: item.model || "", unit: item.unit || "具", category: item.category || "一般",
                            contractQty: 0, safetyStock: 0
                        });
                    }
                });
                await batch.commit();
                document.getElementById('modal-import').classList.add('hidden');
            },

            // --- 表單邏輯 ---
            handleFormInput: function() {
                const matId = document.getElementById('f-mat').value;
                const qty = this.n(document.getElementById('f-qty').value);
                const type = document.getElementById('f-type').value;
                
                const mat = this.state.materials.find(m => String(m.id) === String(matId));
                if (mat && type === '出貨') {
                    const mLogs = this.state.logs.filter(l => String(l.materialId) === String(matId));
                    const totalOut = mLogs.filter(l => l.type === '出貨').reduce((s, l) => s + this.n(l.qty), 0);
                    const isOver = (totalOut + qty) > this.n(mat.contractQty);
                    
                    const w = document.getElementById('overload-warning');
                    const r = document.getElementById('f-reason');
                    if (isOver) {
                        w.classList.remove('hidden');
                        r.required = true;
                    } else {
                        w.classList.add('hidden');
                        r.required = false;
                    }
                } else {
                    document.getElementById('overload-warning')?.classList.add('hidden');
                    const r = document.getElementById('f-reason');
                    if(r) r.required = false;
                }
            },

            submitLog: async function(e) {
                e.preventDefault();
                const matId = document.getElementById('f-mat').value;
                const qty = this.n(document.getElementById('f-qty').value);
                const type = document.getElementById('f-type').value;
                const note = document.getElementById('f-note').value;
                const reason = document.getElementById('f-reason')?.value || "";

                if (!matId || !qty) return alert('請完整填寫項目與數量');

                const logId = `log_${Date.now()}`;
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'logs', logId), {
                    projectId: this.state.currentProject.id, materialId: matId, qty, type,
                    date: document.getElementById('f-date').value,
                    note: note + (reason ? ` [超領原因: ${reason}]` : ""),
                    user: this.state.user.uid
                });
                
                // 重置表單並跳轉
                document.getElementById('log-form').reset();
                this.switchTab('logs');
            },

            exportCSV: function() {
                if (!this.state.currentProject) return;
                const h = ["日期", "單別", "屬性", "品名", "規格", "型號", "異動數量", "單位", "操作人員", "備註"];
                const r = this.state.logs.map(l => {
                    const m = this.state.materials.find(mat => String(mat.id) === String(l.materialId));
                    return [l.date, l.type, m?.category || "", m?.name || "已刪除項目", m?.spec || "", m?.model || "", l.qty, m?.unit || "", l.user.slice(-6), l.note];
                });
                // 加入 UTF-8 BOM 解決 Excel 中文亂碼
                const content = "\uFEFF" + [h, ...r].map(e => e.join(",")).join("\n");
                const blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = `工程異動紀錄_${this.state.currentProject.contractNo}_${new Date().toISOString().split('T')[0]}.csv`;
                link.click();
            },

            // --- 渲染引擎 ---
            getProcessedMaterials: function() {
                return this.state.materials.map(m => {
                    const mLogs = this.state.logs.filter(l => String(l.materialId) === String(m.id));
                    const totalIn = mLogs.filter(l => l.type === '進貨').reduce((s, l) => s + this.n(l.qty), 0);
                    const totalOut = mLogs.filter(l => l.type === '出貨').reduce((s, l) => s + this.n(l.qty), 0);
                    const stock = totalIn - totalOut;
                    const progress = Math.min(100, Math.round((totalOut / (this.n(m.contractQty) || 1)) * 100));
                    return { 
                        ...m, totalIn, totalOut, stock, progress, 
                        isOver: totalOut > this.n(m.contractQty),
                        isLow: stock <= this.n(m.safetyStock) && stock > 0,
                        isEmpty: stock <= 0
                    };
                });
            },

            renderSidebar: function() {
                document.querySelectorAll('.nav-btn').forEach(b => {
                    b.classList.remove('bg-blue-600', 'text-white', 'shadow-xl');
                    b.classList.add('text-slate-400', 'hover:bg-slate-800');
                });
                const activeBtn = document.getElementById(`nav-${this.state.activeTab}`);
                if (activeBtn) {
                    activeBtn.classList.add('bg-blue-600', 'text-white', 'shadow-xl');
                    activeBtn.classList.remove('text-slate-400', 'hover:bg-slate-800');
                }

                const pInfo = document.getElementById('sidebar-project-info');
                const pGroup = document.getElementById('project-nav-group');
                if (this.state.currentProject) {
                    pInfo.classList.remove('hidden');
                    pGroup.classList.remove('hidden');
                    document.getElementById('sidebar-project-name').innerText = this.state.currentProject.name;
                } else {
                    pInfo.classList.add('hidden');
                    pGroup.classList.add('hidden');
                }
            },

            render: function() {
                const main = document.getElementById('main-area');
                if (!main) return;
                const tab = this.state.activeTab;
                
                // Header (搜尋與按鈕) 
                let headerHtml = '';
                if (tab === 'project_select') {
                    headerHtml = `
                        <div class="flex justify-between items-start mb-10 gap-8">
                            <div><h2 class="text-5xl font-black text-slate-900 tracking-tighter mb-3">工程開案中心</h2>
                            <span class="px-3 py-1 bg-emerald-50 text-emerald-600 rounded-full text-[10px] font-black uppercase tracking-widest border border-emerald-100 flex items-center gap-2 w-max"><i data-lucide="shield-check" size="12"></i> 權限驗證成功 | 吳啓仲開發</span></div>
                            <div class="flex gap-4">
                                <button onclick="App.createSampleProject()" class="bg-amber-500 text-white px-8 py-4 rounded-3xl font-black shadow-xl hover:bg-amber-600 transition flex items-center gap-2 active:scale-95 text-sm"><i data-lucide="sparkles"></i> 載入三井範本</button>
                                <button onclick="App.openCreateModal()" class="bg-blue-600 text-white px-8 py-4 rounded-3xl font-black shadow-2xl hover:bg-blue-700 transition active:scale-95 flex items-center gap-2"><i data-lucide="folder-plus"></i> 發起工程</button>
                            </div>
                        </div>
                        <div class="mb-10 relative">
                            <i data-lucide="search" class="absolute left-6 top-1/2 -translate-y-1/2 text-slate-300" size="24"></i>
                            <input type="text" oninput="App.setSearchTerm(this.value)" value="${this.state.searchTerm}" placeholder="快速搜尋專案名稱或合約編號..." class="w-full pl-16 pr-8 py-6 bg-white border-2 border-slate-50 rounded-[2.5rem] text-xl font-bold shadow-sm focus:border-blue-500 outline-none transition-all">
                        </div>`;
                } else if (tab === 'master_library') {
                    headerHtml = `
                        <div class="flex justify-between items-start mb-10 gap-8">
                            <div><h2 class="text-5xl font-black text-slate-900 tracking-tighter mb-3">名稱主檔資料庫</h2>
                            <span class="text-slate-400 font-bold uppercase text-[10px] tracking-widest font-mono">GLOBAL MASTER HUB</span></div>
                            ${!this.state.isAddingNew ? `
                            <div class="flex gap-4">
                                <button onclick="App.seedMasterLibrary()" class="bg-white border-2 border-slate-200 text-slate-600 px-6 py-3 rounded-2xl font-black hover:bg-slate-50 transition shadow-sm text-sm">載入標準範本</button>
                                <button onclick="App.startEdit('master', 'new')" class="bg-slate-900 text-white px-8 py-3 rounded-2xl font-black shadow-xl hover:bg-slate-800 transition active:scale-95 flex items-center gap-2"><i data-lucide="plus"></i> 新增標準項目</button>
                            </div>` : ''}
                        </div>
                        ${!this.state.isAddingNew ? `
                        <div class="mb-10 relative">
                            <i data-lucide="search" class="absolute left-5 top-1/2 -translate-y-1/2 text-slate-300" size="20"></i>
                            <input type="text" oninput="App.setSearchTerm(this.value)" value="${this.state.searchTerm}" placeholder="搜尋庫存名稱或型號..." class="w-full pl-14 pr-6 py-4 bg-white border-2 border-slate-50 rounded-[2rem] text-lg font-bold shadow-sm focus:border-blue-500 outline-none transition-all">
                        </div>` : ''}`;
                } else if (tab === 'dashboard') {
                    headerHtml = `
                        <div class="flex justify-between items-end border-b border-slate-100 pb-8 mb-8">
                            <div><h2 class="text-4xl font-black text-slate-900 tracking-tighter mb-2 italic underline decoration-blue-500 decoration-8">${this.state.currentProject.name}</h2>
                            <p class="text-slate-400 font-bold uppercase tracking-widest text-xs font-mono">PROJECT_ID: ${this.state.currentProject.contractNo}</p></div>
                            <button onclick="App.saveAsProject()" class="bg-white border-2 border-slate-200 text-slate-600 px-5 py-2.5 rounded-2xl text-xs font-black hover:bg-slate-50 flex items-center gap-2 transition-all active:scale-95 shadow-sm"><i data-lucide="copy" size="14"></i> 另存專案副本</button>
                        </div>`;
                } else if (tab === 'inventory') {
                    headerHtml = `
                        <div class="flex justify-between items-center mb-10">
                            <div><h2 class="text-4xl font-black text-slate-900 tracking-tighter">合約細項與庫存</h2>
                            <p class="text-slate-400 font-bold uppercase text-[10px] mt-2 tracking-widest font-mono">CONTRACT SCOPE</p></div>
                            ${!this.state.isAddingNew ? `
                            <div class="flex gap-4">
                                <button onclick="App.openBatchImport()" class="bg-white border-2 border-slate-200 text-blue-600 px-6 py-3 rounded-2xl font-black hover:bg-blue-50 transition shadow-sm flex items-center gap-2 text-sm"><i data-lucide="database" size="18"></i> 批次導入</button>
                                <button onclick="App.startEdit('material', 'new')" class="bg-slate-900 text-white px-8 py-3 rounded-2xl font-black shadow-xl hover:bg-slate-800 transition flex items-center gap-2 active:scale-95 text-sm"><i data-lucide="plus" size="18"></i> 手動建置</button>
                            </div>` : ''}
                        </div>
                        ${!this.state.isAddingNew ? `
                        <div class="mb-10 relative">
                            <i data-lucide="search" class="absolute left-5 top-1/2 -translate-y-1/2 text-slate-300" size="20"></i>
                            <input type="text" oninput="App.setSearchTerm(this.value)" value="${this.state.searchTerm}" placeholder="篩選合約材料..." class="w-full pl-14 pr-6 py-4 bg-white border-2 border-slate-50 rounded-[2rem] text-lg font-bold shadow-sm focus:border-blue-500 outline-none transition-all">
                        </div>` : ''}`;
                } else if (tab === 'logs') {
                    headerHtml = `
                        <div class="flex justify-between items-center bg-white p-10 rounded-[3rem] border border-slate-100 shadow-sm mb-10">
                            <div><h2 class="text-4xl font-black text-slate-900 tracking-tighter mb-1">異動日誌彙整單</h2>
                            <p class="text-slate-400 font-bold uppercase tracking-widest text-[10px] font-mono">HISTORY LOGS</p></div>
                            <button onclick="App.exportCSV()" class="bg-slate-900 text-white px-8 py-4 rounded-2xl hover:bg-slate-800 transition shadow-xl active:scale-95 flex items-center gap-2 font-black text-sm"><i data-lucide="download" size="18"></i> 導出 CSV</button>
                        </div>`;
                }

                // Content wrapper
                let contentHtml = '<div id="list-container"></div>';

                main.innerHTML = `<div class="p-8 md:p-16 max-w-7xl mx-auto animate-in fade-in">${headerHtml}${contentHtml}</div>`;

            <div class="mb-12 text-center">
                <h1 class="text-4xl font-black text-blue-400 tracking-tighter italic text-center uppercase">Material Hub</h1>
                <p class="text-slate-500 text-[10px] font-bold uppercase tracking-[0.3em] mt-2 border-b border-slate-800 pb-4 leading-relaxed font-mono">WU CHI CHUNG<br>PRO MASTER V22-FINAL</p>
            </div>

            <div class="space-y-1 flex-1">
                <button id="nav-project_select" onclick="App.switchTab('project_select')" class="nav-btn w-full flex items-center gap-4 px-6 py-4 rounded-2xl transition font-black bg-blue-600 text-white shadow-xl italic tracking-widest text-sm uppercase">
                    <i data-lucide="briefcase" size="18"></i> 開案中心
                </button>
                <button id="nav-master_library" onclick="App.switchTab('master_library')" class="nav-btn w-full flex items-center gap-4 px-6 py-4 rounded-2xl transition font-black text-slate-400 hover:bg-slate-800 italic tracking-widest text-sm uppercase font-mono">
                    <i data-lucide="database" size="18"></i> 名稱庫
                </button>

                <div id="sidebar-project-info" class="pt-10 mt-10 border-t border-slate-800 hidden animate-in">
                    <p id="sidebar-project-name" class="px-6 text-[11px] font-black text-blue-500 uppercase tracking-widest truncate mb-6 font-mono underline decoration-2 underline-offset-8 decoration-blue-500/30 italic">CURRENT_PROJECT</p>
                    <div id="project-nav-group" class="space-y-1 font-mono">
                        <button id="nav-dashboard" onclick="App.switchTab('dashboard')" class="nav-btn w-full flex items-center gap-4 px-6 py-3.5 rounded-xl hover:bg-slate-800 text-slate-400 text-xs font-black transition-all italic">
                            <i data-lucide="layout-dashboard" size="14"></i> 營運分析
                        </button>
                        <button id="nav-inventory" onclick="App.switchTab('inventory')" class="nav-btn w-full flex items-center gap-4 px-6 py-3.5 rounded-xl hover:bg-slate-800 text-slate-400 text-xs font-black transition-all italic">
                            <i data-lucide="package" size="14"></i> 合約細項
                        </button>
                        <button id="nav-form" onclick="App.switchTab('form')" class="nav-btn w-full flex items-center gap-4 px-6 py-3.5 rounded-xl hover:bg-slate-800 text-slate-400 text-xs font-black transition-all italic">
                            <i data-lucide="plus-circle" size="14"></i> 異動登錄
                        </button>
                        <button id="nav-logs" onclick="App.switchTab('logs')" class="nav-btn w-full flex items-center gap-4 px-6 py-3.5 rounded-xl hover:bg-slate-800 text-slate-400 text-xs font-black transition-all italic">
                            <i data-lucide="history" size="14"></i> 異動日誌
                        </button>
                    </div>
                </div>
            </div>

            <div class="mt-auto pt-8 border-t border-slate-800 space-y-5">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 rounded-2xl bg-blue-600/20 flex items-center justify-center border border-blue-500/30 text-blue-400 font-black shadow-inner font-mono text-xl">
                        <span id="user-initial">?</span>
                    </div>
                    <div>
                        <p class="text-[10px] text-slate-500 font-black uppercase tracking-widest font-mono italic">SYSTEM: WU CHI CHUNG</p>
                        <p class="text-sm font-black text-slate-200 font-mono tracking-tighter italic">在線人數：<span id="global-count">0</span> 人</p>
                        <p class="text-[9px] text-slate-600 font-mono tracking-tighter mt-1 uppercase italic">UID: <span id="user-id">------</span></p>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Main Content Area -->
        <main id="main-area" class="flex-1 overflow-y-auto custom-scrollbar relative bg-[#f8fafc]">
            <div class="h-full flex items-center justify-center animate-pulse">
                <div class="flex flex-col items-center gap-4">
                    <i data-lucide="refresh-cw" class="text-blue-500 animate-spin" size="32"></i>
                    <p class="text-slate-400 font-bold uppercase tracking-widest text-xs italic font-black">連接雲端伺服器中...</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal: 發起新工程 -->
    <div id="modal-create-project" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex items-center justify-center p-6 hidden">
        <div class="bg-white w-full max-w-2xl p-16 rounded-[4.5rem] shadow-2xl border-t-8 border-blue-600 animate-in zoom-in">
            <h2 class="text-5xl font-black text-slate-900 mb-2 tracking-tighter italic text-center uppercase tracking-widest">Init Project</h2>
            <p class="text-slate-400 text-[10px] font-black uppercase tracking-widest mb-12 italic underline decoration-blue-500 decoration-4 text-center font-mono">DEVELOPER: WU CHI CHUNG</p>
            <div class="space-y-8">
                <div class="space-y-3">
                    <label class="text-[11px] font-black text-slate-400 uppercase tracking-widest ml-1 font-mono italic">Project Chinese Name</label>
                    <input id="new-proj-name" type="text" placeholder="例如：高雄三井工程材料管制" class="w-full p-6 bg-slate-50 border-2 border-transparent rounded-3xl font-black text-xl outline-none focus:bg-white focus:border-blue-500 transition shadow-inner italic">
                </div>
                <div class="space-y-3">
                    <label class="text-[11px] font-black text-slate-400 uppercase tracking-widest ml-1 font-mono italic">CONTRACT_ID_NO</label>
                    <input id="new-proj-no" type="text" placeholder="如 CON-2026-YT01" class="w-full p-6 bg-slate-50 border-2 border-transparent rounded-3xl font-mono font-black text-xl outline-none focus:bg-white focus:border-blue-500 transition shadow-inner tracking-widest italic text-blue-600">
                </div>
                <div class="flex gap-4 pt-4">
                    <button onclick="App.closeCreateModal()" class="flex-1 py-7 font-black text-slate-400 hover:text-slate-800 transition tracking-widest uppercase font-mono">CANCEL</button>
                    <button onclick="App.createProject()" class="flex-1 bg-blue-600 text-white py-7 rounded-[2.5rem] font-black shadow-2xl hover:bg-blue-700 active:scale-95 transition-all text-xl uppercase tracking-tighter font-mono italic">Establish</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal: 批次導入 -->
    <div id="modal-import" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex items-center justify-center p-6 hidden">
        <div class="bg-white w-full max-w-2xl p-12 rounded-[4rem] shadow-2xl flex flex-col max-h-[85vh] animate-in zoom-in border-t-8 border-blue-600">
            <div class="flex justify-between items-center mb-8">
                <div>
                    <h3 class="text-4xl font-black tracking-tighter italic font-mono uppercase">Batch Import</h3>
                    <p class="text-slate-400 font-bold text-[10px] mt-2 uppercase tracking-widest font-mono">Select Items from Master DB</p>
                </div>
                <button onclick="document.getElementById('modal-import').classList.add('hidden')" class="p-2 hover:bg-slate-100 rounded-full transition"><i data-lucide="x"></i></button>
            </div>
            <div id="import-list-container" class="overflow-y-auto pr-2 custom-scrollbar flex-1">
                <!-- Javascript will populate this -->
            </div>
            <div class="mt-8 flex gap-4 pt-6 border-t border-slate-50">
                <button onclick="App.executeBatchImport()" class="flex-1 bg-blue-600 text-white py-6 rounded-[2.5rem] font-black text-xl shadow-2xl hover:bg-blue-700 transition active:scale-95 italic tracking-widest uppercase font-mono">Confirm Import</button>
            </div>
        </div>
    </div>
</body>
</html>
